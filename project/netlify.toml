# Netlify build settings. Netlify reads this from the site's base directory, so set the
# base directory to `project` if the site is linked to this repository.

[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    # @netlify/blobs needs Node >= 22.12. Functions run on the same Node version as the build.
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Built files have content-hashed names, so they never change: let browsers keep them for
# a year. Repeat visits (and the fonts) then load instantly even on poor venue Wi-Fi.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be served from a cache, or an old copy could keep an old app
# alive. (Browsers re-check it on every visit and install a new one when its bytes change.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
